# Database Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://192.168.38.138:5432/buku
quarkus.datasource.username=buku_user
quarkus.datasource.password=12345678
quarkus.hibernate-orm.database.generation=update

# gRPC Server Configuration
quarkus.grpc.server.port=50051
quarkus.grpc.server.use-separate-server=true
#quarkus.grpc.server.reflection-service.enabled=true

# Enable CORS
quarkus.http.port=8081
#quarkus.http.reflection.enable=true
quarkus.http.cors=true
quarkus.http.cors.origins=https://grpc.tech-ai.my.id
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,x-user-agent
quarkus.http.cors.access-control-max-age=24H
